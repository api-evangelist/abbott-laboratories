description: >-
  Abbott Laboratories is a global healthcare company that develops, manufactures,
  and markets pharmaceuticals, medical devices, diagnostics, and nutritional products.
  Abbott's digital health portfolio includes the FreeStyle Libre continuous glucose
  monitoring system, cardiac monitoring devices, and connected diagnostics platforms
  that enable data sharing between patients, caregivers, and healthcare providers.
