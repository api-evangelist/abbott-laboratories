x-coverage:
  state: gated
  reason: sales-gate
  detail: >-
    Abbott's one real API — the LibreView cloud API behind FreeStyle Libre and LibreLinkUp —
    has no public reference at all: access is granted only through a partner agreement
    negotiated directly with Abbott Diabetes Care, and the page apis.yml carried as Abbott's
    developer portal turns out to be a supplier-and-licensing page that names no API, SDK or
    documentation anywhere on it.
